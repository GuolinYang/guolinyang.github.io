<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">PIP-CN world model planning pipeline</title><desc id="desc">Observation is encoded into a latent state, rolled forward through action-conditioned dynamics, evaluated for reward value and collision risk, and planned with MPPI.</desc><rect width="960" height="540" fill="#f7f8fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="72" font-size="28" font-weight="700" fill="#1f2937">Interaction-Aware World Model</text><text x="60" y="105" font-size="17" fill="#667085">Observation → latent prediction → MPPI → action → replan</text><g fill="#fff" stroke="#c9d1d9" stroke-width="2"><rect x="60" y="185" rx="18" width="150" height="92"/><rect x="260" y="185" rx="18" width="150" height="92"/><rect x="460" y="185" rx="18" width="190" height="92"/><rect x="700" y="185" rx="18" width="170" height="92"/></g><g fill="#1f2937" font-size="18" font-weight="700" text-anchor="middle"><text x="135" y="224">Observation</text><text x="335" y="224">Encoder</text><text x="555" y="216">Action-Conditioned</text><text x="555" y="241">Latent Dynamics</text><text x="785" y="224">MPPI Planner</text></g><g fill="#667085" font-size="14" text-anchor="middle"><text x="135" y="250">ego + pedestrians</text><text x="335" y="250">compact state</text><text x="555" y="263">multi-step rollout</text><text x="785" y="250">candidate controls</text></g><g stroke="#667085" stroke-width="3" fill="none"><path d="M210 231h50"/><path d="M410 231h50"/><path d="M650 231h50"/></g><g fill="#667085"><path d="M253 224l14 7-14 7z"/><path d="M453 224l14 7-14 7z"/><path d="M693 224l14 7-14 7z"/></g><g fill="#fff" stroke="#c9d1d9" stroke-width="2"><rect x="360" y="355" rx="16" width="130" height="72"/><rect x="515" y="355" rx="16" width="130" height="72"/><rect x="670" y="355" rx="16" width="130" height="72"/></g><g fill="#1f2937" font-size="16" font-weight="700" text-anchor="middle"><text x="425" y="386">Reward</text><text x="580" y="386">Value</text><text x="735" y="378">Collision</text><text x="735" y="399">Risk</text></g><path d="M555 277v52" stroke="#667085" stroke-width="3"/><path d="M555 329h-130v26M555 329h25v26M555 329h180v26" stroke="#667085" stroke-width="3" fill="none"/><rect x="60" y="355" rx="16" width="210" height="72" fill="#eef2f6" stroke="#c9d1d9" stroke-width="2"/><text x="165" y="386" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Closed-loop execution</text><text x="165" y="410" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#667085">act → observe → update → replan</text></g></svg>