<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Safety-aware MPPI with CVaR and control barrier functions</title><desc id="desc">Candidate trajectories are shaped with tail-risk costs and the executable action is corrected by a local safety filter before being applied.</desc><rect width="960" height="540" fill="#f7f8fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="72" font-size="28" font-weight="700" fill="#1f2937">Safety-Aware MPPI</text><text x="60" y="105" font-size="17" fill="#667085">Long-horizon risk shaping + execution-level safety filtering</text><g fill="#fff" stroke="#c9d1d9" stroke-width="2"><rect x="60" y="190" rx="18" width="180" height="90"/><rect x="300" y="190" rx="18" width="190" height="90"/><rect x="550" y="190" rx="18" width="150" height="90"/><rect x="760" y="190" rx="18" width="140" height="90"/></g><g fill="#1f2937" font-size="18" font-weight="700" text-anchor="middle"><text x="150" y="226">MPPI Sampling</text><text x="395" y="218">CVaR / Robust</text><text x="395" y="243">Risk Cost</text><text x="625" y="218">Weighted</text><text x="625" y="243">Action</text><text x="830" y="218">Safe</text><text x="830" y="243">Command</text></g><g fill="#667085" font-size="14" text-anchor="middle"><text x="150" y="252">candidate trajectories</text><text x="395" y="264">tail-critical interactions</text><text x="625" y="264">nominal control</text><text x="830" y="264">execute</text></g><g stroke="#667085" stroke-width="3" fill="none"><path d="M240 235h60"/><path d="M490 235h60"/><path d="M700 235h60"/></g><g fill="#667085"><path d="M293 228l14 7-14 7z"/><path d="M543 228l14 7-14 7z"/><path d="M753 228l14 7-14 7z"/></g><rect x="535" y="350" rx="18" width="220" height="90" fill="#eef2f6" stroke="#c9d1d9" stroke-width="2"/><text x="645" y="382" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937">CBF Safety Filter</text><text x="645" y="408" font-size="14" tex